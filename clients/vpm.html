<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Personal — Project Clarity</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="../shared/dashboard.css" />
<script src="../shared/clients.js"></script>

<!-- =====================================================================
     CLIENT_DATA stub for sync — must be set BEFORE sync.js so storage
     is scoped by client id. Full CLIENT_DATA (campaigns, funnel, notes,
     etc.) is defined at the bottom of this file and merges into the stub.
     ===================================================================== -->
<script>
  window.CLIENT_DATA = window.CLIENT_DATA || {};
  window.CLIENT_DATA.id = 'vpm';
</script>
<script src="../shared/sync.js"></script>


<style>
  /* VPM planner: widen the page so the calendar and notes get more room.
     Uses (almost) the full viewport — caps at 2000px on ultrawide displays
     so reading lines never get absurd. */
  .site-inner {
    max-width: min(2000px, calc(100vw - 32px)) !important;
    padding-left: 24px !important;
    padding-right: 24px !important;
  }
  .page {
    max-width: min(2000px, calc(100vw - 32px)) !important;
    padding-left: 24px !important;
    padding-right: 24px !important;
  }

  /* Home: notes spans full width; calendar fills the row below */
  #panel-home.is-active {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 24px;
    align-items: start;
  }
  /* =====================================================================
     Money snapshot — horizontal strip on Home that reads totals from the
     Numbers spreadsheet (pc-ops::vpm::numbers::v1) so the user can see
     revenue, costs, and profit alongside urgent notes + calendar.
     ===================================================================== */
  .money-snapshot {
    background: #ffffff;
    border: 1px solid #ebe6d4;
    border-radius: 12px;
    padding: 10px 14px 12px;
  }
  .money-snapshot-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .money-snapshot-head h3 {
    margin: 0;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #a86b14;
    font-weight: 700;
    white-space: nowrap;
  }
  /* Trickle / waterfall strip in the header: shows the flow from revenue
     down to weekly + yearly pay as a sequence of pills with arrows. */
  .money-flow {
    display: flex;
    align-items: stretch;
    flex-wrap: wrap;
    gap: 4px;
    flex: 1 1 auto;
    min-width: 0;
    justify-content: center;
  }
  .money-flow-step {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 5px 10px;
    border-radius: 8px;
    background: #faf6e7;
    border: 1px solid #efe9d3;
    min-width: 0;
  }
  .money-flow-step .mfs-label {
    font-size: 9.5px;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: #6c6f7a;
    font-weight: 600;
    white-space: nowrap;
  }
  .money-flow-step .mfs-amount {
    font-size: 14px;
    font-weight: 800;
    color: #11131a;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .money-flow-step.is-rev    { background: #e8f7ec; border-color: #c4ead0; }
  .money-flow-step.is-rev .mfs-amount    { color: #15803d; }
  .money-flow-step.is-cost,
  .money-flow-step.is-super,
  .money-flow-step.is-tax    { background: #fdecec; border-color: #f5cccc; }
  .money-flow-step.is-cost  .mfs-amount,
  .money-flow-step.is-super .mfs-amount,
  .money-flow-step.is-tax   .mfs-amount  { color: #b3261e; }
  .money-flow-step.is-profit { background: #ecf2ff; border-color: #d4e0ff; }
  .money-flow-step.is-profit .mfs-amount { color: #2960ff; }
  .money-flow-step.is-month  { background: #11131a; border-color: #11131a; }
  .money-flow-step.is-month .mfs-label    { color: #d9a544; }
  .money-flow-step.is-month .mfs-amount   { color: #ffffff; }
  .money-flow-step.is-pay    { background: #e8f7ec; border-color: #c4ead0; }
  .money-flow-step.is-pay .mfs-amount    { color: #15803d; }
  /* Revenue subgroups: MRR + Project under Expected Revenue */
  .money-rev-grouped { display: flex; flex-direction: column; gap: 12px; padding: 8px 10px !important; }
  .money-subgroup { display: flex; flex-direction: column; gap: 4px; }
  .money-subgroup-head {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #5a5f6e;
  }
  .money-subgroup-head .msg-name { font-weight: 700; }
  .money-subgroup-head .msg-total {
    font-weight: 800;
    color: #15803d;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
    text-transform: none;
    font-size: 12.5px;
  }
  .money-subgroup-head .msg-add {
    margin-left: auto;
    border: 1px solid #d4d8e0;
    background: #fff;
    color: #5a5f6e;
    border-radius: 6px;
    padding: 0 8px;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    line-height: 18px;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
  }
  .money-subgroup-head .msg-add:hover { background: #15803d; color: #fff; border-color: #15803d; }
  .ms-type-sel {
    font: inherit;
    font-size: 10px;
    background: rgba(255,255,255,0.6);
    border: 1px solid #d4d8e0;
    border-radius: 4px;
    color: #5a5f6e;
    padding: 1px 2px;
    cursor: pointer;
  }
  .money-flow-sep {
    display: inline-flex;
    align-items: center;
    color: #b6b9c2;
    font-weight: 700;
    padding: 0 1px;
    font-size: 12px;
    user-select: none;
  }
  .money-flow-step .mfs-rate {
    width: 22px;
    font-size: 9.5px;
    font-weight: 700;
    text-align: right;
    background: rgba(255,255,255,0.5);
    color: inherit;
    padding: 0 1px;
    margin-left: 2px;
  }
  .money-flow-step .mfs-rate + .ms-rate-pct { font-size: 9px; }
  .money-snapshot-head .ms-link {
    font-size: 11px;
    color: #5a5f6e;
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: 0;
    font: inherit;
    padding: 0;
  }
  /* Two-column label/value table, like the user's reference sheet */
  .money-table {
    display: grid;
    grid-template-columns: 200px minmax(0, 1fr);
    border-top: 1px solid #ebe6d4;
  }
  .money-table > div {
    padding: 7px 10px;
    border-bottom: 1px solid #ebe6d4;
    font-size: 13px;
    line-height: 1.45;
    min-width: 0;
  }
  .money-label {
    font-weight: 600;
    color: #11131a;
    background: #faf6e7;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 4px;
  }
  .money-label .ml-name { font-size: 13px; }
  .money-label .ml-total {
    font-size: 18px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .money-label .ml-sub {
    font-size: 11px;
    color: #6c6f7a;
    font-weight: 500;
    margin-top: 2px;
    line-height: 1.3;
  }
  .money-row-rev    .ml-total { color: #16a34a; }
  .money-row-cost   .ml-total { color: #b3261e; }
  .money-row-profit .ml-total { color: #2960ff; }
  .money-row-pay    .ml-total { color: #16a34a; }
  .money-value {
    color: #2a2d39;
    overflow-wrap: anywhere;
    font-variant-numeric: tabular-nums;
  }
  .money-value .ms-amount { font-weight: 700; color: #11131a; }
  .money-value .ms-plus,
  .money-value .ms-eq,
  .money-value .ms-minus { color: #8b8f9a; margin: 0 4px; font-weight: 600; }
  .money-value .ms-total { font-weight: 800; color: #11131a; padding-left: 4px; }
  .money-row-rev .ms-total    { color: #16a34a; }
  .money-row-cost .ms-total   { color: #b3261e; }
  .money-row-profit .ms-total { color: #2960ff; }
  .money-row-pay .ms-total    { color: #16a34a; }
  .money-empty {
    color: #6c6f7a;
    font-size: 12px;
    padding: 12px;
    text-align: center;
  }
  .ms-head-actions { display: inline-flex; gap: 10px; align-items: center; }
  .ms-head-actions .ms-link {
    border: 1px solid transparent;
    padding: 3px 8px;
    border-radius: 6px;
    transition: background 120ms ease, border-color 120ms ease;
    text-decoration: none;
  }
  .ms-head-actions .ms-link:hover { background: #faf6e7; border-color: #efe9d3; text-decoration: underline; }

  /* Editable item chip */
  .ms-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 4px 2px 6px;
    border: 1px solid transparent;
    border-radius: 6px;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .ms-item:hover { background: #faf6e7; border-color: #efe9d3; }
  .ms-item:focus-within { background: #fff; border-color: #2960ff33; box-shadow: 0 0 0 2px #2960ff14; }

  .ms-amount-in, .ms-label-in, .ms-rate-in {
    font: inherit;
    border: 0;
    background: transparent;
    padding: 1px 2px;
    border-radius: 4px;
    color: inherit;
    min-width: 0;
  }
  .ms-amount-in {
    width: 70px;
    font-weight: 700;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .money-row-rev .ms-amount-in    { color: #16a34a; }
  .money-row-cost .ms-amount-in   { color: #b3261e; }
  .ms-label-in {
    width: auto;
    min-width: 60px;
    flex: 0 1 auto;
    color: #5a5f6e;
    font-size: 12px;
  }
  .ms-label-in:focus, .ms-amount-in:focus, .ms-rate-in:focus {
    background: #fff;
    outline: 1px solid #2960ff44;
    color: #11131a;
  }
  .ms-rate-in {
    width: 28px;
    text-align: right;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .ms-rate-pct { color: #8b8f9a; margin-right: 2px; }
  .ms-del {
    border: 0;
    background: transparent;
    color: #b6b9c2;
    cursor: pointer;
    font-size: 14px;
    padding: 0 4px;
    line-height: 1;
    border-radius: 4px;
    opacity: 0;
    transition: opacity 120ms ease, background 120ms ease, color 120ms ease;
  }
  .ms-item:hover .ms-del { opacity: 1; }
  .ms-del:hover { background: #ffe4e4; color: #b3261e; }
  .ms-empty-hint { font-style: italic; color: #8b8f9a; }

  #panel-home > #money-sheet { grid-column: 1; grid-row: 1; }
  #panel-home > #gsheet-embed { grid-column: 1; grid-row: 2; }
  #panel-home > .pinned { grid-column: 1; grid-row: 3; }
  #panel-home > #current-week-pinned { grid-column: 1; grid-row: 4; }
  #panel-home > #planner-cal { grid-column: 1; grid-row: 5; }
  #panel-home > .home-custom { grid-column: 1; }
  .key-dates { display: none !important; }
  /* VPM-only: hide the 
 button */
  #reset-template { display: none !important; }
  .key-dates-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #11131a;
    border-bottom: 1px solid #efe9d3;
    padding-bottom: 10px;
    margin-bottom: 12px;
    outline: none;
    cursor: text;
  }
  .key-dates-title:focus { background: #fffcef; }
  .key-dates-title:empty::before {
    content: 'Section title';
    color: #b6b2a3;
  }
  .key-dates-body {
    font-size: 14px;
    line-height: 1.55;
    color: #11131a;
    min-height: 280px;
    outline: none;
    cursor: text;
    white-space: pre-wrap;
  }
  .key-dates-body:focus { background: #fffcef; }
  .key-dates-body:empty::before {
    content: 'Add key dates, milestones, deadlines…';
    color: #b6b2a3;
  }
  @media (max-width: 1100px) {
    #panel-home { grid-template-columns: 1fr; }
    .key-dates { grid-row: auto; grid-column: 1; position: static; }
  }
</style>
<style>
  /* ── Planner calendar ─────────────────────────────────────────────── */
  .planner-cal {
    font-family: 'Poppins', system-ui, sans-serif;
    color: #11131a;
    margin: 28px 0 36px;
    background: #fff;
    border: 1px solid #ebe6d4;
    border-radius: 18px;
    padding: 24px 28px 28px;
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.02);
  }
  .cal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    gap: 12px;
  }
  .cal-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .cal-title .cal-year {
    color: #6c6f7a;
    font-weight: 500;
    margin-left: 8px;
  }
  .cal-nav { display: flex; gap: 6px; align-items: center; }
  .cal-nav button {
    background: #f3efe1;
    border: 1px solid #e6e2d2;
    color: #11131a;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: background 0.15s ease;
  }
  .cal-nav button:hover { background: #ebe6d4; }
  .cal-nav .cal-today {
    width: auto;
    padding: 0 14px;
    font-weight: 600;
    font-size: 13px;
    background: #fff;
  }
  .cal-weeks {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .cal-week {
    border: 1px solid #efe9d3;
    border-radius: 12px;
    overflow: hidden;
    background: #faf6e7;
  }
  .cal-week.has-today { border-color: #b8c8ff; }
  .cal-week-head {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    background: transparent;
    border: 0;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
  }
  .cal-week-head:hover { background: rgba(0,0,0,0.02); }
  .cal-week-label {
    font-size: 14px;
    font-weight: 700;
    color: #11131a;
    letter-spacing: -0.005em;
  }
  .cal-week.has-today .cal-week-label { color: #2960ff; }
  .cal-week-range {
    font-size: 13px;
    color: #6c6f7a;
  }
  .cal-week-inline-note {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    color: #11131a;
    padding: 4px 8px;
    border-radius: 6px;
    outline: none;
    cursor: text;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cal-week-inline-note:hover { background: rgba(0,0,0,0.03); }
  .cal-week-inline-note:focus {
    background: #fffcef;
    white-space: normal;
    overflow: visible;
  }
  .cal-week-count {
    font-size: 12px;
    color: #6c6f7a;
    background: rgba(0,0,0,0.04);
    padding: 4px 10px;
    border-radius: 999px;
  }
  .cal-week-chev {
    width: 22px;
    height: 22px;
    color: #6c6f7a;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease;
  }
  .cal-week.is-open .cal-week-chev { transform: rotate(180deg); }
  .cal-week-body {
    display: none;
    padding: 4px 14px 16px;
    background: #fff;
    border-top: 1px solid #efe9d3;
  }
  .cal-week.is-open .cal-week-body { display: block; }

  .cal-cell-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }
  .cal-cell-head .cal-dow {
    font-size: 10px;
    font-weight: 700;
    color: #6c6f7a;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-top: 12px;
  }
  /* Week-section open body uses the wide open-column layout, not aspect-ratio cells. */
  .cal-week-body .cal-grid.cal-grid-week {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 0;
    margin-top: 0;
    border-top: 1px solid #efe9d3;
    background: #fff;
  }
  .cal-week-body .cal-grid.cal-grid-week .cwg-col {
    min-height: 240px;
    border-right: 1px solid #efe9d3;
  }
  .cal-week-body .cal-grid.cal-grid-week .cwg-col:last-child { border-right: 0; }
  .cal-week-body .cal-grid.cal-grid-week .cwg-col-head { padding: 12px 10px 10px; }
  .cal-week-body .cal-grid.cal-grid-week .cwg-col-head .cwg-num { font-size: 18px; }
  .cal-week-body .cal-grid.cal-grid-week .cwg-col-free { padding: 10px 12px; min-height: 200px; }

  .cal-week-inline-notes,
  .cal-week-note-btn { /* keep inline-notes hidden if any leftover; new popup button below */ }
  .cal-week-inline-notes { display: none; }

  .cal-week-note-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #fdfbf3;
    border: 1px solid #efe9d3;
    color: #6c6f7a;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    max-width: 260px;
  }
  .cal-week-note-btn:hover { background: #f5efd6; color: #11131a; }
  .cal-week-note-btn svg { width: 14px; height: 14px; flex: 0 0 auto; }
  .cal-week-note-btn.has-note { background: #fff7e0; border-color: #f0e0a4; color: #11131a; }
  .cwnb-preview {
    display: none;
  }

  /* Week note popup */
  .cwn-pop {
    position: absolute;
    z-index: 300;
    width: 340px;
    background: #fff;
    border: 1px solid #e6e2d2;
    border-radius: 12px;
    box-shadow: 0 14px 38px rgba(0,0,0,0.18);
    padding: 14px 16px 16px;
    display: none;
  }
  .cwn-pop.is-open { display: block; }
  .cwn-pop-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .cwn-pop-title {
    font-size: 11px;
    font-weight: 700;
    color: #a86b14;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .cwn-pop-close {
    background: transparent;
    border: 0;
    color: #6c6f7a;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 2px 6px;
  }
  .cwn-pop-body {
    width: 100%;
    min-height: 140px;
    resize: vertical;
    border: 1px solid #e6e2d2;
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    color: #11131a;
    background: #fffcef;
    outline: none;
  }
  .cwn-pop-body:focus { border-color: #c8c0a0; }
  .cal-week-chev {
    background: transparent;
    border: 0;
    color: #6c6f7a;
    cursor: pointer;
    padding: 4px;
  }

  .cal-week-notes {
    background: #fdfbf3;
    border-top: 1px solid #efe9d3;
    padding: 14px 18px 16px;
  }
  .cwn-head { margin-bottom: 6px; }
  .cwn-label {
    font-size: 10px;
    font-weight: 700;
    color: #a86b14;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .cwn-body {
    font-size: 14px;
    line-height: 1.55;
    color: #11131a;
    outline: none;
    min-height: 32px;
    cursor: text;
    white-space: pre-wrap;
  }
  .cwn-body:focus { background: #fffcef; border-radius: 6px; }
  .cwn-body:empty::before {
    content: attr(data-placeholder);
    color: #b6b2a3;
    pointer-events: none;
  }

  .cal-cell {
    aspect-ratio: 1 / 0.92;
    background: #faf6e7;
    border: 1px solid #efe9d3;
    border-radius: 10px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: relative;
    transition: background 0.12s ease, border-color 0.12s ease;
    overflow: hidden;
  }
  .cal-cell-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex: 0 0 auto;
    cursor: default;
  }
  .cal-cell-free {
    flex: 1;
    font-size: 12px;
    line-height: 1.4;
    color: #11131a;
    outline: none;
    overflow: auto;
    cursor: text;
    white-space: pre-wrap;
  }
  .cal-cell-free:focus { background: #fffcef; border-radius: 6px; }
  .cal-cell-free:empty::before {
    content: '';
  }
  .cal-cell:hover .cal-cell-free:empty::before {
    content: 'Click to type…';
    color: #b6b2a3;
  }
  .cal-cell.is-outside {
    background: #fbfaf5;
    color: #b6b2a3;
  }
  .cal-cell.is-today {
    background: #dde7ff;
    border-color: #2960ff;
  }
  .cal-cell.is-today .cal-daynum { color: #2960ff; }
  .cal-cell.has-events {
    background: #fff;
    border-color: #d8d2b8;
  }
  .cal-daynum {
    font-size: 14px;
    font-weight: 600;
    color: #11131a;
  }
  .cal-events {
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow: hidden;
  }
  .cal-event {
    background: #2960ff;
    color: #fff;
    font-size: 11px;
    font-weight: 500;
    line-height: 1.25;
    padding: 3px 7px;
    border-radius: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cal-event.is-busy   { background: #2960ff; }
  .cal-event.is-task   { background: #11131a; }
  .cal-event.is-note   { background: #f4c25a; color: #11131a; }

  /* ── Day editor modal ── */
  .cal-modal {
    position: fixed;
    inset: 0;
    background: rgba(20, 24, 40, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
  }
  .cal-modal.is-open { display: flex; }
  .cal-modal-card {
    background: #fff;
    border-radius: 18px;
    width: 100%;
    max-width: 460px;
    padding: 26px 28px 24px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
  }
  .cal-modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .cal-modal-date {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
  }
  .cal-modal-close {
    background: transparent;
    border: 0;
    font-size: 22px;
    color: #6c6f7a;
    cursor: pointer;
    width: 28px;
    height: 28px;
    line-height: 1;
  }
  .cal-event-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }
  .cal-event-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f7f3e1;
    border-radius: 9px;
    padding: 10px 12px;
  }
  .cal-event-row select {
    background: #fff;
    border: 1px solid #e6e2d2;
    border-radius: 6px;
    padding: 4px 6px;
    font-size: 12px;
    font-family: inherit;
  }
  .cal-event-row input {
    flex: 1;
    background: transparent;
    border: 0;
    font-family: inherit;
    font-size: 14px;
    color: #11131a;
    outline: none;
  }
  .cal-event-row button {
    background: transparent;
    border: 0;
    color: #6c6f7a;
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
  }
  .cal-event-row button:hover { color: #c0392b; }
  .cal-modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 6px;
  }
  .cal-btn {
    background: #f3efe1;
    border: 1px solid #e6e2d2;
    padding: 8px 14px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .cal-btn.primary { background: #11131a; color: #fff; border-color: #11131a; }
  .cal-btn:hover { background: #ebe6d4; }
  .cal-btn.primary:hover { background: #2960ff; border-color: #2960ff; }

  /* ── Week view (Google Calendar style) ─────────────────────────── */
  /* ── Calendar collapse + week view (open columns) */
  /* Pinned "this week" section above the Calendar accordion */
  .current-week-pinned {
    background: #fff;
    border: 1px solid #ebe6d4;
    border-radius: 18px;
    padding: 16px 18px;
    margin: 0 0 18px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.02);
  }
  .cwp-head { margin-bottom: 10px; }
  .cwp-kicker {
    font-size: 11px;
    font-weight: 700;
    color: #2960ff;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .cwp-body .cal-week { border: 0; background: transparent; }
  .cwp-body .cal-week-head { padding: 6px 4px 14px; }
  .cwp-body .cal-week-chev,
  .cwp-body .cal-week-note-btn { display: none !important; }

  /* Month accordion (May / June / July …) */
  .cal-months { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }
  .cal-month {
    background: #fff;
    border: 1px solid #ebe6d4;
    border-radius: 14px;
    overflow: hidden;
  }
  /* "You are here" tint on the current month */
  .cal-month.is-current {
    background: #fef6dc;
    border-color: #e8c97a;
    box-shadow: 0 0 0 1px rgba(232, 201, 122, 0.25);
  }
  .cal-month.is-current .cal-month-name { color: #6b4a13; }
  .cal-month.is-current .cal-month-year { color: #a86b14; }
  .cal-month.is-current .cal-month-head:hover { background: rgba(168, 107, 20, 0.05); }
  .cal-month-head {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: transparent;
    border: 0;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
  }
  .cal-month-head:hover { background: rgba(17,19,26,0.025); cursor: pointer; }
  .cal-month-head .cal-month-chev svg { transition: transform 0.2s ease; }
  .cal-month-chev {
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #6c6f7a;
    transition: transform 0.2s ease;
  }
  .cal-month-chev svg { width: 18px; height: 18px; }
  .cal-month.is-open .cal-month-chev { transform: rotate(90deg); }
  .cal-month-name { font-size: 18px; font-weight: 700; color: #11131a; letter-spacing: -0.01em; }
  .cal-month-year { font-size: 16px; color: #6c6f7a; font-weight: 500; }
  .cal-month-body { display: none; padding: 0 14px 14px; }
  .cal-month.is-open .cal-month-body { display: block; }
  .cal-month-body .cal-weeks { gap: 10px; }

  /* Undo button on a day column. Sits on the column, not inside the
     editable area, so it never becomes part of the day's content.
     Appears on hover, and only when there is something to undo. */
  .cell-revert {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 22px;
    height: 22px;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
    background: rgba(255,255,255,0.92);
    border: 1px solid rgba(17,19,26,0.12);
    border-radius: 50%;
    color: #6c6f7a;
    cursor: pointer;
    z-index: 2;
  }
  .cell-revert svg { width: 12px; height: 12px; }
  .cwg-col:hover .cell-revert:not([hidden]) { display: inline-flex; }
  .cell-revert:hover { color: #a86b14; border-color: #a86b14; }
  .cell-revert:focus-visible { display: inline-flex; outline: 2px solid #2960ff; outline-offset: 1px; }

  /* Momentary confirmation that an edit reached storage. Deliberately
     quiet — a soft green edge on the field you just typed in. */
  .cwg-col-free.is-saved,
  .cal-week-inline-note.is-saved,
  .key-dates-body.is-saved,
  .key-dates-title.is-saved {
    box-shadow: inset 2px 0 0 #16a34a;
    transition: box-shadow 180ms ease;
  }

  /* "Calendar" wrapper toggle */
  .cal-wrap-head {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    border: 0;
    padding: 4px 6px;
    cursor: pointer;
    font-family: inherit;
  }
  .cal-wrap-head:hover { background: rgba(0,0,0,0.02); border-radius: 8px; }
  .cal-wrap-chev {
    width: 22px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #6c6f7a;
    transition: transform 0.2s ease;
  }
  .cal-wrap-chev svg { width: 18px; height: 18px; }
  .planner-cal:not(.is-collapsed) .cal-wrap-chev { transform: rotate(90deg); }
  .cal-wrap-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    color: #11131a;
  }
  .planner-cal.is-collapsed .cal-months { display: none !important; }
  .planner-cal.is-collapsed { padding-bottom: 18px; }

  /* Hide the global toolbar title row now that each month has its own header. */
  .planner-cal > .cal-head > .cal-title { display: none !important; }
  .planner-cal.is-collapsed > .cal-head > .cal-title { display: block !important; }

  .cal-collapse {
    background: transparent;
    border: 0;
    color: #6c6f7a;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-right: 6px;
    transition: transform 0.2s ease, background 0.15s ease;
  }
  .cal-collapse:hover { background: #f3efe1; }
  .cal-collapse svg { width: 18px; height: 18px; }
  .planner-cal.is-collapsed .cal-collapse { transform: rotate(-90deg); }
  .planner-cal.is-collapsed .cal-mode,
  .planner-cal.is-collapsed .cal-nav,
  .planner-cal.is-collapsed .cal-weeks,
  .planner-cal.is-collapsed .cal-week-grid { display: none !important; }
  .planner-cal.is-collapsed { padding: 14px 24px; }
  .planner-cal.is-collapsed .cal-head { margin: 0; }

  .cal-mode {
    display: inline-flex;
    background: #f3efe1;
    border: 1px solid #e6e2d2;
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    margin: 0 12px;
  }
  .cal-mode button {
    background: transparent;
    border: 0;
    color: #6c6f7a;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .cal-mode button.is-on {
    background: #11131a;
    color: #fff;
  }
  .cal-head { display: flex; align-items: center; gap: 10px; }
  .cal-head .cal-nav { margin-left: auto; }
  .cal-head .cal-title { margin-right: auto; }
  .cal-head .cal-mode { margin-right: 0; margin-left: 0; }

  .cal-week-grid {
    display: grid;
    gap: 0;
    border: 1px solid #efe9d3;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    margin-top: 8px;
    min-height: 480px;
  }
  .cwg-col {
    display: flex;
    flex-direction: column;
    border-right: 1px solid #efe9d3;
    background: #fff;
    min-height: 480px;
  }
  .cwg-col:last-child { border-right: 0; }
  .cwg-col.is-today { background: #f6f9ff; }
  .cwg-col-head {
    background: #faf6e7;
    border-bottom: 1px solid #efe9d3;
    padding: 14px 14px 12px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .cwg-col.is-today .cwg-col-head { background: #dde7ff; }
  .cwg-col-head .cwg-dow {
    font-size: 11px;
    font-weight: 700;
    color: #6c6f7a;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .cwg-col-head .cwg-num {
    font-size: 22px;
    font-weight: 700;
    color: #11131a;
  }
  .cwg-col.is-today .cwg-col-head .cwg-dow,
  .cwg-col.is-today .cwg-col-head .cwg-num { color: #2960ff; }
  .cwg-col-chips {
    padding: 10px 10px 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .cwg-col-chips:empty { padding: 0; }
  .cwg-col-free {
    flex: 1;
    padding: 10px;
    font-size: 14px;
    line-height: 1.5;
    color: #11131a;
    outline: none;
    min-height: 200px;
    cursor: text;
    white-space: pre-wrap;
  }
  .cwg-col-free:empty::before {
    content: attr(data-placeholder);
    color: #b6b2a3;
    pointer-events: none;
  }
  .cwg-col-free:focus { background: #fffcef; }
  .cwg-chip {
    background: #2960ff;
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.3;
    padding: 6px 9px;
    border-radius: 6px;
    cursor: pointer;
    word-break: break-word;
  }
  .cwg-chip.is-task { background: #11131a; }
  .cwg-chip.is-note { background: #f4c25a; color: #11131a; }
  .cwg-chip.is-busy { background: #2960ff; }
  .cwg-chip-time {
    font-size: 11px;
    opacity: 0.85;
    margin-right: 4px;
    font-weight: 600;
  }

  .cal-event-row .ev-start,
  .cal-event-row .ev-end {
    background: #fff;
    border: 1px solid #e6e2d2;
    border-radius: 6px;
    padding: 4px 6px;
    font-size: 12px;
    font-family: inherit;
    width: 92px;
  }

  @media (max-width: 720px) {
    .cwg-block-text { font-size: 11px; }
    .cwg-hour { font-size: 10px; }
  }

  /* Floating mini text-formatting toolbar */
  .fmt-toolbar {
    position: absolute;
    z-index: 600;
    display: none;
    background: #11131a;
    color: #fff;
    border-radius: 8px;
    padding: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    gap: 2px;
    font-family: inherit;
  }
  .fmt-toolbar.is-open { display: inline-flex; }
  .fmt-toolbar button {
    background: transparent;
    border: 0;
    color: #fff;
    width: 28px;
    height: 26px;
    border-radius: 5px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .fmt-toolbar button:hover { background: rgba(255,255,255,0.12); }
  .fmt-toolbar .fmt-i { font-style: italic; }
  .fmt-toolbar .fmt-u { text-decoration: underline; }
  .fmt-toolbar .fmt-s { text-decoration: line-through; }
  .fmt-toolbar .fmt-swatch {
    width: 18px; height: 18px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18);
    cursor: pointer; padding: 0;
  }
  /* Section-fill controls: square swatches (vs round text-colour dots) so the
     two palettes are easy to tell apart. */
  .fmt-toolbar .fmt-fill-icon { display: inline-flex; align-items: center; color: rgba(255,255,255,0.6); margin: 0 1px; }
  .fmt-toolbar .fmt-fill {
    width: 18px; height: 18px; border-radius: 5px;
    border: 1px solid rgba(255,255,255,0.35);
    cursor: pointer; padding: 0;
    transition: transform 100ms ease;
  }
  .fmt-toolbar .fmt-fill:hover { transform: scale(1.12); }
  .fmt-toolbar .fmt-fill-none {
    background: #2a2d37; color: #cfd3dc; font-size: 12px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .fmt-toolbar .fmt-sep { width: 1px; height: 20px; background: rgba(255,255,255,0.15); margin: 0 4px; align-self: center; }

  /* Full-width section background applied to a block line. Zero vertical
     padding keeps consecutive coloured lines flush as one continuous band. */
  [contenteditable="true"] .pc-section {
    padding: 0 6px;
    box-sizing: border-box;
  }

  /* Stuck-block remover: hover any pasted <table> inside an editable to
     get a small ✕ button that yanks the whole block in one click. */
  .pc-block-del {
    position: absolute;
    z-index: 650;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #b86040;
    color: #fff;
    border: 2px solid #fff;
    cursor: pointer;
    font: 700 13px/1 -apple-system, sans-serif;
    box-shadow: 0 4px 12px rgba(184,96,64,0.35);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: background 120ms ease, transform 120ms ease;
  }
  .pc-block-del:hover { background: #9a4a30; transform: scale(1.08); }

  /* Bullet/ordered lists inside any contenteditable region */
  [contenteditable="true"] ul,
  [contenteditable="true"] ol {
    margin: 4px 0;
    padding-left: 20px;
  }
  [contenteditable="true"] ul { list-style: disc; }
  [contenteditable="true"] ol { list-style: decimal; }
  [contenteditable="true"] li { margin: 2px 0; }

  /* Apple Notes-style checkbox todos inside contenteditable regions */
  .pc-todo {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 4px 0;
    line-height: 1.55;
  }
  .pc-todo-box {
    appearance: none;
    -webkit-appearance: none;
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    margin-top: 3px;
    border: 2px solid #c7c2a9;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    position: relative;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .pc-todo-box:hover { border-color: #a86b14; }
  .pc-todo-box:checked {
    background: #a86b14;
    border-color: #a86b14;
  }
  .pc-todo-box:checked::after {
    content: '';
    position: absolute;
    left: 4px; top: 0;
    width: 5px; height: 10px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .pc-todo-text {
    flex: 1 1 auto;
    min-width: 0;
    outline: none;
    transition: color 160ms ease, text-decoration-color 160ms ease;
  }
  .pc-todo.is-checked .pc-todo-text {
    color: #9a9684;
    text-decoration: line-through;
    text-decoration-color: rgba(168, 107, 20, 0.5);
  }

  /* Annotated text — click to view/edit the attached note */
  .annotated {
    background: transparent;
    border-bottom: 1px dashed rgba(245, 158, 11, 0.75);
    cursor: pointer;
    padding: 0;
    transition: background 120ms ease;
  }
  .annotated:hover { background: rgba(254, 243, 199, 0.6); }
  /* While its note popover is open, keep the phrase emphasised. */
  .annotated.is-active { background: rgba(254, 243, 199, 0.9); }
  /* Small superscript dot marking that a note is attached. It sits above the
     baseline so it never overlaps neighbouring words the way the old inline
     emoji did — and the whole highlighted phrase is the click target. */
  .annotated::after {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-left: 3px;
    border-radius: 50%;
    background: #f59e0b;
    vertical-align: super;
    transition: transform 120ms ease, box-shadow 120ms ease;
  }
  .annotated:hover::after,
  .annotated.is-active::after {
    transform: scale(1.15);
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18);
  }
  /* Hover card — previews the note and gives big Edit / Remove buttons, so
     you never have to precisely click the thin highlighted text. */
  .note-hint {
    position: absolute;
    z-index: 800;
    max-width: 300px;
    background: #fffdf7;
    color: #2b2f3a;
    border: 1px solid #f0e0a4;
    padding: 9px 11px;
    border-radius: 9px;
    font: 500 12.5px/1.5 'Poppins', -apple-system, sans-serif;
    box-shadow: 0 10px 28px rgba(17, 19, 26, 0.16);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .note-hint-actions {
    display: flex;
    gap: 6px;
    margin-top: 9px;
  }
  .note-hint-actions button {
    appearance: none;
    border: 1px solid rgba(17, 19, 26, 0.12);
    background: #fff;
    color: #2b2f3a;
    border-radius: 6px;
    padding: 5px 12px;
    font: 600 11px/1 'Poppins', sans-serif;
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
  }
  .note-hint-edit { background: #2960ff; color: #fff; border-color: #2960ff; }
  .note-hint-edit:hover { background: #1c47cc; }
  .note-hint-remove:hover { background: #faf3ee; border-color: rgba(184,96,64,0.3); color: #b86040; }

  /* Note edit popup */
  .note-popup {
    position: absolute;
    z-index: 700;
    background: #ffffff;
    border: 1px solid rgba(17,19,26,0.10);
    border-radius: 10px;
    box-shadow: 0 14px 36px rgba(17,19,26,0.16);
    padding: 10px;
    width: 280px;
    font-family: 'Poppins', -apple-system, sans-serif;
    color: #2b2f3a;
  }
  .note-popup-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 0 2px 8px;
  }
  .note-popup-title {
    font: 600 12px/1 'Poppins', sans-serif;
    letter-spacing: 0.02em;
    color: #11131a;
  }
  .note-popup-kbd {
    font: 500 10px/1 'Poppins', sans-serif;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #9a8f6a;
  }
  .note-popup textarea {
    width: 100%;
    min-height: 70px;
    border: 1px solid rgba(17,19,26,0.10);
    border-radius: 6px;
    padding: 8px 10px;
    font: 400 13px/1.5 'Poppins', -apple-system, sans-serif;
    color: inherit;
    resize: vertical;
    outline: none;
  }
  .note-popup textarea:focus { border-color: rgba(41,96,255,0.4); box-shadow: 0 0 0 3px rgba(41,96,255,0.12); }
  .note-popup-actions {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    gap: 8px;
  }
  .note-popup-actions button {
    appearance: none;
    border: 1px solid rgba(17,19,26,0.10);
    background: #f9f5e7;
    color: #2b2f3a;
    border-radius: 6px;

<body>
<script src="../shared/dashboard.js"></script>
<script src="../shared/nav.js"></script>
<script>
  /* =====================================================================
     Floating text-formatting toolbar — appears when the user selects
     text inside any contenteditable element on the page (day cells,
     week notes, key dates, etc.). Bold, italic, underline, and a
     curated swatch of colors. Uses document.execCommand for simplicity;
     the contenteditable rich-text writes survive localStorage since we
     store innerHTML.
     ===================================================================== */
  (function initFormatToolbar() {
    const COLORS = ['#11131a', '#2960ff', '#ef4444', '#16a34a', '#a86b14', '#6c6f7a'];
    // Light tints for full-width section backgrounds (Morning, Work, etc.).
    const FILLS  = ['#fef9c3', '#dcfce7', '#dbeafe', '#fee2e2', '#ede9fe', '#ffedd5'];
    const bar = document.createElement('div');
    bar.className = 'fmt-toolbar';
    bar.innerHTML = `
      <button type="button" data-cmd="bold" title="Bold (Ctrl+B)"><span class="fmt-b">B</span></button>
      <button type="button" data-cmd="italic" title="Italic (Ctrl+I)"><span class="fmt-i">I</span></button>
      <button type="button" data-cmd="underline" title="Underline (Ctrl+U)"><span class="fmt-u">U</span></button>
      <button type="button" data-cmd="strikeThrough" title="Strikethrough"><span class="fmt-s">S</span></button>
      <button type="button" data-action="clear-format" title="Remove formatting">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 7h9"/>
          <path d="M10.5 7v8"/>
          <line x1="4.5" y1="19" x2="18.5" y2="5"/>
        </svg>
      </button>
      <span class="fmt-sep"></span>
      <button type="button" data-action="checkbox" title="Checkbox todo">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <polyline points="8 12 11 15 16 9"/>
        </svg>
      </button>
      <button type="button" data-cmd="insertUnorderedList" title="Bullet list">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="6" x2="20" y2="6"></line><line x1="9" y1="12" x2="20" y2="12"></line><line x1="9" y1="18" x2="20" y2="18"></line><circle cx="4.5" cy="6" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="4.5" cy="12" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="4.5" cy="18" r="1.3" fill="currentColor" stroke="none"></circle></svg>
      </button>
      <span class="fmt-sep"></span>
      <button type="button" data-action="font-smaller" title="Smaller text"><span style="font-size:9px;font-weight:700;letter-spacing:0">A−</span></button>
      <button type="button" data-action="font-larger"  title="Larger text"><span style="font-size:14px;font-weight:700;letter-spacing:0">A+</span></button>
      <span class="fmt-sep"></span>
      <button type="button" data-action="add-note" title="Add a note to the selected text">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="9" y1="13" x2="15" y2="13"/>
          <line x1="9" y1="17" x2="13" y2="17"/>
        </svg>
      </button>
      <span class="fmt-sep"></span>
      ${COLORS.map((c) => `<button type="button" class="fmt-swatch" data-color="${c}" style="background:${c}" title="Text colour: ${c}"></button>`).join('')}
      <span class="fmt-sep"></span>
      <span class="fmt-fill-icon" title="Section background — fills the whole line, not just the text">
        <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="currentColor" opacity="0.85"></rect></svg>
      </span>
      ${FILLS.map((f) => `<button type="button" class="fmt-fill" data-fill="${f}" style="background:${f}" title="Section background"></button>`).join('')}
      <button type="button" class="fmt-fill fmt-fill-none" data-fill="" title="Remove section background">⊘</button>
    `;
    document.body.appendChild(bar);

    let savedRange = null;

    function inEditable() {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
      const range = sel.getRangeAt(0);
      let node = range.commonAncestorContainer;
      if (node.nodeType === 3) node = node.parentElement;
      const ce = node.closest('[contenteditable="true"]');
      return ce ? range : null;
    }

    function positionBar(range) {
      const rect = range.getBoundingClientRect();
      if (!rect.width && !rect.height) return;
      const margin = 8;
      const barW = bar.offsetWidth;
      const barH = bar.offsetHeight;

      // Vertical: prefer above; flip below if no room at the top of the viewport.
      let top;
      if (rect.top - barH - margin < margin) {
        top = rect.bottom + window.scrollY + margin;
      } else {
        top = rect.top + window.scrollY - barH - margin;
      }

      // Horizontal: center on selection, clamp to viewport edges.
      let left = rect.left + window.scrollX + rect.width / 2 - barW / 2;
      const minLeft = window.scrollX + margin;
      const maxLeft = window.scrollX + document.documentElement.clientWidth - barW - margin;
      left = Math.max(minLeft, Math.min(left, maxLeft));

      bar.style.top  = top + 'px';
      bar.style.left = left + 'px';
    }

    function updateBar() {
      const range = inEditable();
      if (!range) {
        bar.classList.remove('is-open');
        return;
      }
      savedRange = range.cloneRange();
      bar.classList.add('is-open');
      positionBar(range);
    }

    document.addEventListener('mouseup', () => setTimeout(updateBar, 0));
    document.addEventListener('keyup', updateBar);
    document.addEventListener('selectionchange', updateBar);

    bar.addEventListener('mousedown', (e) => {
      // Prevent the click from collapsing the selection before we act
      e.preventDefault();
    });
    bar.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      if (savedRange) {
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedRange);
      }
      if (btn.dataset.cmd) {
        document.execCommand(btn.dataset.cmd, false, null);
      } else if (btn.dataset.color) {
        document.execCommand('styleWithCSS', false, true);
        document.execCommand('foreColor', false, btn.dataset.color);
      } else if (btn.dataset.fill !== undefined) {
        applySectionFill(btn.dataset.fill);
      } else if (btn.dataset.action === 'clear-format') {
        clearFormatting();
      } else if (btn.dataset.action === 'add-note') {
        wrapSelectionAsNote();
      } else if (btn.dataset.action === 'font-smaller') {
        adjustFontSize(-1);
      } else if (btn.dataset.action === 'font-larger') {
        adjustFontSize(+1);
      } else if (btn.dataset.action === 'checkbox') {
        insertCheckbox();
      }
      // Re-fire whatever input listener the surrounding editor wired up so the
      // change is persisted to localStorage.
      const ce = window.getSelection().anchorNode &&
                 (window.getSelection().anchorNode.nodeType === 3
                    ? window.getSelection().anchorNode.parentElement
                    : window.getSelection().anchorNode)
                  .closest('[contenteditable="true"]');
      if (ce) ce.dispatchEvent(new Event('input', { bubbles: true }));
    });

    // Remove ALL formatting from the selection: inline styles (bold, italic,
    // underline, strikethrough, colour, size) via removeFormat, PLUS block
    // formatting — checkbox todos and bullet/numbered lists are flattened
    // back to plain lines. The text itself is always preserved. Annotations
    // (notes) are left alone; they have their own Remove control.
    function clearFormatting() {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);
      let probe = range.commonAncestorContainer;
      if (probe.nodeType === 3) probe = probe.parentElement;
      const ce = probe && probe.closest && probe.closest('[contenteditable="true"]');
      if (!ce) return;

      // Capture block-level formatted elements the selection touches BEFORE we
      // mutate anything (removeFormat can reshuffle inline nodes).
      const blocks = [];
      ce.querySelectorAll('.pc-todo, ul, ol').forEach((el) => {
        try { if (range.intersectsNode(el)) blocks.push(el); } catch (_) {}
      });

      // 1. Inline styles.
      document.execCommand('styleWithCSS', false, true);
      document.execCommand('removeFormat', false, null);

      // 2. Flatten checkbox todos and lists to plain <div> lines.
      blocks.forEach((el) => {
        if (!el.isConnected) return;
        if (el.classList && el.classList.contains('pc-todo')) {
          const t = el.querySelector('.pc-todo-text');
          const line = document.createElement('div');
          line.innerHTML = t ? t.innerHTML : el.textContent;
          el.replaceWith(line);
        } else { // UL / OL
          const frag = document.createDocumentFragment();
          el.querySelectorAll(':scope > li').forEach((li) => {
            const line = document.createElement('div');
            line.innerHTML = li.innerHTML;
            frag.appendChild(line);
          });
          if (frag.childNodes.length) el.replaceWith(frag);
          else el.remove();
        }
      });

      fireInputFor(ce);
    }

    // Apply (or clear) a FULL-WIDTH background to the block LINE(S) the
    // selection covers — a "section" colour, not a text highlight. Passing ''
    // removes it. The day cells nest lines inside larger container <div>s, so
    // we must colour the individual line blocks and never a wrapper (which
    // would shade far more than the user selected).
    function applySectionFill(color) {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);
      let probe = range.commonAncestorContainer;
      if (probe.nodeType === 3) probe = probe.parentElement;
      const ce = probe && probe.closest && probe.closest('[contenteditable="true"]');
      if (!ce) return;

      const LINE = /^(DIV|P|LI|H[1-6]|BLOCKQUOTE)$/;
      // True overlap with an element's contents (strict, so a selection that
      // merely ends at a block's boundary doesn't count it).
      function hits(el) {
        const er = document.createRange();
        er.selectNodeContents(el);
        try {
          return range.compareBoundaryPoints(Range.END_TO_START, er) < 0
              && range.compareBoundaryPoints(Range.START_TO_END, er) > 0;
        } catch (_) { return false; }
      }
      // A "line" is a checkbox todo, or a block that does NOT itself contain
      // another block line with text — i.e. a leaf line, never a wrapper.
      function isLine(el) {
        if (el.classList && el.classList.contains('pc-todo')) return true;
        if (!LINE.test(el.tagName)) return false;
        const inner = el.querySelectorAll('div,p,li,h1,h2,h3,h4,h5,h6,.pc-todo');
        for (let i = 0; i < inner.length; i++) {
          if (inner[i].textContent && inner[i].textContent.trim()) return false;
        }
        return true;
      }

      if (color) {
        let cand = [];
        ce.querySelectorAll('div,p,li,h1,h2,h3,h4,h5,h6,.pc-todo').forEach((el) => {
          if (hits(el) && isLine(el)) cand.push(el);
        });
        // Keep only outermost lines (drop inner blocks inside a chosen todo).
        cand = cand.filter((el) => !cand.some((o) => o !== el && o.contains(el)));
        if (!cand.length) {
          const b = probe.closest && probe.closest('.pc-todo,div,p,li,h1,h2,h3,h4,h5,h6');
          if (b && b !== ce && ce.contains(b)) cand = [b];
        }
        cand.forEach((el) => { el.classList.add('pc-section'); el.style.backgroundColor = color; });
      } else {
        // Clear every overlapping section fill, including legacy wrappers that
        // spanned too much and any ancestor wrapper of the selection.
        const targets = new Set();
        ce.querySelectorAll('.pc-section').forEach((el) => { if (hits(el)) targets.add(el); });
        let a = probe;
        while (a && a !== ce) { if (a.classList && a.classList.contains('pc-section')) targets.add(a); a = a.parentNode; }
        targets.forEach((el) => {
          el.classList.remove('pc-section');
          el.style.backgroundColor = '';
          if (!el.getAttribute('class')) el.removeAttribute('class');
          if (!el.getAttribute('style')) el.removeAttribute('style');
        });
      }
      fireInputFor(ce);
    }

    // ── Annotation popup ────────────────────────────────────────────
    const pop = document.createElement('div');
    pop.className = 'note-popup';
    pop.style.display = 'none';
    pop.innerHTML = `
      <div class="note-popup-head">
        <span class="note-popup-title">Note</span>
        <span class="note-popup-kbd">⌘↵ save · esc close</span>
      </div>
      <textarea placeholder="Write a note for the highlighted text…"></textarea>
      <div class="note-popup-actions">
        <button type="button" class="note-popup-remove">Remove</button>
        <button type="button" class="note-popup-save">Done</button>
      </div>
    `;
    document.body.appendChild(pop);
    let activeSpan = null;

    function fireInputFor(el) {
      const ce = el && el.closest && el.closest('[contenteditable="true"]');
      if (ce) ce.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function unwrap(span) {
      const parent = span.parentNode;
      if (!parent) return;
      while (span.firstChild) parent.insertBefore(span.firstChild, span);
      parent.removeChild(span);
      parent.normalize();
    }

    function openPopupFor(span) {
      if (typeof hideHint === 'function') hideHint();
      if (activeSpan && activeSpan !== span) activeSpan.classList.remove('is-active');
      activeSpan = span;
      span.classList.add('is-active');
      const ta = pop.querySelector('textarea');
      ta.value = span.getAttribute('data-note') || '';
      const rect = span.getBoundingClientRect();
      pop.style.display = 'block';
      // Position below the span; flip above if near the bottom of the viewport.
      const popH = pop.offsetHeight || 140;
      const room = window.innerHeight - rect.bottom;
      const top = (room < popH + 16 ? rect.top - popH - 6 : rect.bottom + 6) + window.scrollY;
      const left = Math.max(8, Math.min(rect.left + window.scrollX, window.scrollX + window.innerWidth - pop.offsetWidth - 8));
      pop.style.top = top + 'px';
      pop.style.left = left + 'px';
      setTimeout(() => ta.focus(), 0);
    }

    function closePopup() {
      pop.style.display = 'none';
      const span = activeSpan;
      activeSpan = null;
      if (!span) return;
      span.classList.remove('is-active');
      // A freshly-created highlight that never received any text: remove it so
      // we don't leave an empty, note-less highlight behind (e.g. on Esc).
      if (!span.getAttribute('data-note')) {
        const ce = span.closest('[contenteditable="true"]');
        unwrap(span);
        if (ce) ce.dispatchEvent(new Event('input', { bubbles: true }));
      }
    }

    function wrapSelectionAsNote() {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);

      // If selection is inside an existing annotated span, just open it.
      let parent = range.commonAncestorContainer;
      if (parent.nodeType === 3) parent = parent.parentElement;
      const existing = parent && parent.closest && parent.closest('.annotated');
      if (existing) { openPopupFor(existing); return; }

      if (sel.isCollapsed) return;

      const span = document.createElement('span');
      span.className = 'annotated';
      span.setAttribute('data-note', '');
      try {
        range.surroundContents(span);
      } catch (_) {
        // Selection crosses element boundaries — fall back to extract + insert
        const frag = range.extractContents();
        span.appendChild(frag);
        range.insertNode(span);
      }
      fireInputFor(span);
      sel.removeAllRanges();
      openPopupFor(span);
    }

    // Convert the current selection (or current line) into an Apple Notes-
    // style checkbox todo.
    function buildTodo(textHtml) {
      const todo = document.createElement('div');
      todo.className = 'pc-todo';
      todo.innerHTML =
        '<input type="checkbox" class="pc-todo-box" contenteditable="false">' +
        '<span class="pc-todo-text">' + (textHtml || '​') + '</span>';
      return todo;
    }
    function insertCheckbox() {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);
      let probe = range.commonAncestorContainer;
      if (probe.nodeType === 3) probe = probe.parentElement;
      const ce = probe && probe.closest && probe.closest('[contenteditable="true"]');
      if (!ce) return;

      // If we're already inside a todo, do nothing (clicking the button
      // again on the same line shouldn't nest).
      if (probe.closest('.pc-todo')) return;

      let textHtml = '';
      if (!sel.isCollapsed) {
        const frag = range.extractContents();
        const tmp = document.createElement('div');
        tmp.appendChild(frag);
        textHtml = tmp.innerHTML;
      }
      const todo = buildTodo(textHtml);
      range.insertNode(todo);

      // Place cursor at end of the text span
      const textSpan = todo.querySelector('.pc-todo-text');
      const newRange = document.createRange();
      newRange.selectNodeContents(textSpan);
      newRange.collapse(false);
      sel.removeAllRanges();
      sel.addRange(newRange);

      ce.dispatchEvent(new Event('input', { bubbles: true }));
    }

    // Toggle checked state on click — keep the `checked` attribute in sync
    // so the saved innerHTML preserves the state across reload/sync.
    document.addEventListener('change', (e) => {
      const box = e.target;
      if (!box.classList || !box.classList.contains('pc-todo-box')) return;
      const todo = box.closest('.pc-todo');
      if (!todo) return;
      if (box.checked) {
        box.setAttribute('checked', '');
        todo.classList.add('is-checked');
      } else {
        box.removeAttribute('checked');
        todo.classList.remove('is-checked');
      }
      const ce = todo.closest('[contenteditable="true"]');
      if (ce) ce.dispatchEvent(new Event('input', { bubbles: true }));
    });

    // On load (and any subsequent re-render), make sure todos whose stored
    // HTML has `checked` are visually checked via the .is-checked class.
    function hydrateTodos(root) {
      (root || document).querySelectorAll('.pc-todo').forEach((todo) => {
        const box = todo.querySelector('.pc-todo-box');
        if (box && box.hasAttribute('checked')) {
          box.checked = true;
          todo.classList.add('is-checked');
        }
      });
    }
    hydrateTodos();
    new MutationObserver((muts) => {
      for (const m of muts) {
        m.addedNodes.forEach((n) => {
          if (n.nodeType === 1) {
            if (n.classList && n.classList.contains('pc-todo')) hydrateTodos(n.parentNode);
            else if (n.querySelector && n.querySelector('.pc-todo')) hydrateTodos(n);
          }
        });
      }
    }).observe(document.body, { childList: true, subtree: true });

    // Pressing Enter at the end of a todo creates a new empty todo below;
    // pressing Enter on an empty todo exits the list back to a plain line.
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || e.shiftKey) return;
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;
      let node = sel.anchorNode;
      if (node && node.nodeType === 3) node = node.parentNode;
      const todo = node && node.closest && node.closest('.pc-todo');
      if (!todo) return;
      const textSpan = todo.querySelector('.pc-todo-text');
      const txt = (textSpan.textContent || '').replace(/​/g, '').trim();
      e.preventDefault();
      const ce = todo.closest('[contenteditable="true"]');
      if (!txt) {
        // Empty todo → replace with a blank paragraph so user can keep typing
        const empty = document.createElement('div');
        empty.innerHTML = '<br>';
        todo.parentNode.replaceChild(empty, todo);
        const r = document.createRange();
        r.setStart(empty, 0);
        r.collapse(true);
        sel.removeAllRanges();
        sel.addRange(r);
      } else {
        // Insert a fresh empty todo below
        const fresh = buildTodo('');
        todo.parentNode.insertBefore(fresh, todo.nextSibling);
        const r = document.createRange();
        r.selectNodeContents(fresh.querySelector('.pc-todo-text'));
        r.collapse(false);
        sel.removeAllRanges();
        sel.addRange(r);
      }
      if (ce) ce.dispatchEvent(new Event('input', { bubbles: true }));
    });

    // Step through preset font sizes for the current selection.
    const FONT_SIZES = [10, 12, 13, 14, 16, 18, 22, 28];
    function adjustFontSize(direction) {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
      const range = sel.getRangeAt(0);
      // Detect current size from the selection's parent element
      let probe = range.commonAncestorContainer;
      if (probe.nodeType === 3) probe = probe.parentElement;
      const current = parseFloat(window.getComputedStyle(probe).fontSize) || 14;
      // Find nearest preset, then step
      let idx = FONT_SIZES.findIndex((s) => s >= Math.round(current));
      if (idx === -1) idx = FONT_SIZES.length - 1;
      const newIdx = Math.max(0, Math.min(FONT_SIZES.length - 1, idx + direction));
      const newSize = FONT_SIZES[newIdx];
      const span = document.createElement('span');
      span.style.fontSize = newSize + 'px';
      try {
        range.surroundContents(span);
      } catch (_) {
        const frag = range.extractContents();
        span.appendChild(frag);
        range.insertNode(span);
      }
      // Google Sheets / Docs paste wraps text in spans + td with explicit
      // font-size (often in pt). Strip any inline font-size on descendants
      // AND ancestor table cells inside this editable so the wrapper's
      // value actually wins.
      span.querySelectorAll('[style*="font-size"]').forEach((el) => {
        el.style.fontSize = '';
        if (!el.getAttribute('style')) el.removeAttribute('style');
      });
      const ce = span.closest('[contenteditable="true"]');
      let anc = span.parentElement;
      while (anc && anc !== ce) {
        if (anc.style && anc.style.fontSize) {
          anc.style.fontSize = '';
          if (!anc.getAttribute('style')) anc.removeAttribute('style');
        }
        anc = anc.parentElement;
      }
      fireInputFor(span);
      // Re-select the resized text so user can keep stepping
      const newRange = document.createRange();
      newRange.selectNodeContents(span);
      sel.removeAllRanges();
      sel.addRange(newRange);
    }

    // Click an annotated span to view/edit its note
    document.addEventListener('click', (e) => {
      const span = e.target.closest && e.target.closest('.annotated');
      if (span) {
        e.preventDefault();
        openPopupFor(span);
        return;
      }
      // Ignore clicks that originated inside the formatting toolbar —
      // the Note button there just OPENED the popup; don't immediately
      // close it.
      if (e.target.closest && e.target.closest('.fmt-toolbar')) return;
      if (pop.style.display === 'block' && !pop.contains(e.target)) {
        // Click outside popup — auto-save
        commitPopup();
      }
    });

    // Hover card: previews the note and gives big, reliable Edit / Remove
    // buttons. Clicking the thin highlighted text inside an editable region
    // is fiddly, so the card is the primary way to act on a note. A short
    // hide delay lets the pointer travel from the text onto the card.
    let hintEl = null, hintSpan = null, hintHideTimer = null;
    function hideHint() {
      clearTimeout(hintHideTimer);
      if (hintEl) { hintEl.remove(); hintEl = null; hintSpan = null; }
    }
    function scheduleHideHint() {
      clearTimeout(hintHideTimer);
      hintHideTimer = setTimeout(hideHint, 240);
    }
    function showHint(span) {
      if (span === activeSpan) return;                 // editor already open
      if (hintSpan === span && hintEl) { clearTimeout(hintHideTimer); return; }
      hideHint();
      hintSpan = span;
      const note = span.getAttribute('data-note');
      hintEl = document.createElement('div');
      hintEl.className = 'note-hint';
      const txt = document.createElement('div');
      txt.className = 'note-hint-text';
      txt.textContent = note || 'Empty note';
      const actions = document.createElement('div');
      actions.className = 'note-hint-actions';
      const editBtn = document.createElement('button');
      editBtn.type = 'button'; editBtn.className = 'note-hint-edit'; editBtn.textContent = 'Edit';
      const removeBtn = document.createElement('button');
      removeBtn.type = 'button'; removeBtn.className = 'note-hint-remove'; removeBtn.textContent = 'Remove';
      actions.appendChild(editBtn); actions.appendChild(removeBtn);
      hintEl.appendChild(txt); hintEl.appendChild(actions);
      document.body.appendChild(hintEl);
      hintEl.addEventListener('mouseenter', () => clearTimeout(hintHideTimer));
      hintEl.addEventListener('mouseleave', scheduleHideHint);
      editBtn.addEventListener('click', (ev) => {
        ev.preventDefault(); ev.stopPropagation();
        const s = hintSpan; hideHint(); openPopupFor(s);
      });
      removeBtn.addEventListener('click', (ev) => {
        ev.preventDefault(); ev.stopPropagation();
        const s = hintSpan; hideHint();
        const ce = s.closest('[contenteditable="true"]');
        unwrap(s);
        if (ce) ce.dispatchEvent(new Event('input', { bubbles: true }));
      });
      const rect = span.getBoundingClientRect();
      const tH = hintEl.offsetHeight;
      const tW = hintEl.offsetWidth;
      const top = (window.innerHeight - rect.bottom < tH + 16)
        ? rect.top + window.scrollY - tH - 6
        : rect.bottom + window.scrollY + 6;
      const left = Math.max(8, Math.min(rect.left + window.scrollX,
        window.scrollX + document.documentElement.clientWidth - tW - 8));
      hintEl.style.top = top + 'px';
      hintEl.style.left = left + 'px';
    }
    document.addEventListener('mouseover', (e) => {
      const span = e.target.closest && e.target.closest('.annotated');
      if (span) { clearTimeout(hintHideTimer); showHint(span); }
    });
    document.addEventListener('mouseout', (e) => {
      const span = e.target.closest && e.target.closest('.annotated');
      if (!span) return;
      const to = e.relatedTarget;
      if (to && to.closest && (to.closest('.note-hint') || to.closest('.annotated'))) return;
      scheduleHideHint();
    });

    function commitPopup() {
      if (!activeSpan) { closePopup(); return; }
      const val = pop.querySelector('textarea').value.trim();
      const ce = activeSpan.closest('[contenteditable="true"]');
      if (!val) {
        unwrap(activeSpan);
      } else {
        activeSpan.setAttribute('data-note', val);
        activeSpan.removeAttribute('title'); // custom tooltip handles preview
      }
      if (ce) ce.dispatchEvent(new Event('input', { bubbles: true }));
      closePopup();
    }

    pop.querySelector('.note-popup-save').addEventListener('click', commitPopup);
    pop.querySelector('.note-popup-remove').addEventListener('click', () => {
      if (!activeSpan) { closePopup(); return; }
      const ce = activeSpan.closest('[contenteditable="true"]');
      unwrap(activeSpan);
      if (ce) ce.dispatchEvent(new Event('input', { bubbles: true }));
      closePopup();
    });
    pop.querySelector('textarea').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); commitPopup(); }
      if (e.key === 'Escape') { e.preventDefault(); closePopup(); }
    });
  })();
</script>
<script>
  /* =====================================================================
     Undo / redo for every contenteditable region. The planner's custom
     operations (notes, checkboxes, clear-formatting, font size) mutate the
     DOM directly, which the browser's native undo cannot track — so we keep
     a small per-field innerHTML history and handle Cmd/Ctrl+Z ourselves
     (add Shift, or use Ctrl+Y, to redo). We only act when a planner text
     field is focused, so the money spreadsheet keeps its own undo button.
     ===================================================================== */
  (function initUndoHistory() {
    const HISTORY = new WeakMap();   // editable -> { stack:[html], i, t }
    const MAX = 120;
    const DEBOUNCE = 350;

    function histFor(ce) {
      let h = HISTORY.get(ce);
      if (!h) { h = { stack: [ce.innerHTML], i: 0, t: null }; HISTORY.set(ce, h); }
      return h;
    }
    function snapshot(ce) {
      const h = histFor(ce);
      const html = ce.innerHTML;
      if (h.stack[h.i] === html) return;
      h.stack = h.stack.slice(0, h.i + 1);
      h.stack.push(html);
      if (h.stack.length > MAX) h.stack.shift();
      h.i = h.stack.length - 1;
    }
    function scheduleSnapshot(ce) {
      const h = histFor(ce);
      clearTimeout(h.t);
      h.t = setTimeout(() => snapshot(ce), DEBOUNCE);
    }
    function restore(ce, html) {
      ce.innerHTML = html;
      ce.dispatchEvent(new Event('input', { bubbles: true }));
      try {
        const r = document.createRange();
        r.selectNodeContents(ce); r.collapse(false);
        const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      } catch (_) {}
    }
    function undo(ce) {
      const h = histFor(ce);
      clearTimeout(h.t);
      if (h.stack[h.i] !== ce.innerHTML) snapshot(ce);   // capture latest edit first
      if (h.i > 0) { h.i--; restore(ce, h.stack[h.i]); return true; }
      return false;
    }
    function redo(ce) {
      const h = histFor(ce);
      if (h.i < h.stack.length - 1) { h.i++; restore(ce, h.stack[h.i]); return true; }
      return false;
    }

    // Seed the pre-edit state on focus and before the first keystroke, so the
    // earliest change in a field is always undoable.
    document.addEventListener('focusin', (e) => {
      const ce = e.target.closest && e.target.closest('[contenteditable="true"]');
      if (ce) histFor(ce);
    });
    document.addEventListener('beforeinput', (e) => {
      const ce = e.target.closest && e.target.closest('[contenteditable="true"]');
      if (ce) histFor(ce);
    }, true);
    document.addEventListener('input', (e) => {
      const ce = e.target.closest && e.target.closest('[contenteditable="true"]');
      if (ce) scheduleSnapshot(ce);
    });
    document.addEventListener('keydown', (e) => {
      if (!(e.metaKey || e.ctrlKey)) return;
      const k = e.key.toLowerCase();
      if (k !== 'z' && k !== 'y') return;
      const ae = document.activeElement;
      if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return; // native undo in fields
      const ce = ae && ae.closest && ae.closest('[contenteditable="true"]');
      if (!ce) return;                                    // not in a planner field — leave Ctrl+Z alone
      if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); redo(ce); }
      else if (k === 'z') { e.preventDefault(); undo(ce); }
    }, true);
  })();
</script>
