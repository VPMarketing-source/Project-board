<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Personal Planner — Project Clarity</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="../shared/dashboard.css" />
<link rel="stylesheet" href="../shared/calendar.css?v=13" />
<link rel="stylesheet" href="../shared/planner-text.css?v=10" />
<script src="../shared/clients.js"></script>
<script>
  /* =====================================================================
     Personal Planner — the calendar and nothing else.

     Deliberately does NOT load shared/dashboard.js: that renders the tab
     bar, Notes box, Forecast/Campaigns/Retainer/Tasks/Links panels and the
     ClickUp controls, none of which belong here. shared/calendar.js mounts
     itself into [data-calendar-root] when the dashboard is absent.

     id is DELIBERATELY 'vpm' — the same id the VP Marketing planner uses.
     The id scopes localStorage and the Supabase client_id column, so
     sharing it means this page and clients/vpm.html read and write the
     exact same calendar: every day, task, event and week note is mirrored
     across both, and edits sync live in either direction. The heading below
     still reads "Personal Planner"; only the underlying data is shared.
     ===================================================================== */
  window.CLIENT_DATA = {
    id:       'vpm',
    name:     'Personal Planner',
    initials: 'PP',
    sub:      '',
  };
</script>
<script src="../shared/sync.js"></script>
<style>
  body {
    margin: 0;
    background: #f7f2e7;
    font-family: Poppins, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #11131a;
  }
  .pp-wrap {
    max-width: min(2400px, calc(100vw - 24px));
    margin: 0 auto;
    padding: 16px 12px 80px;
  }
  .pp-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 8px 0 18px;
  }
  .pp-avatar {
    width: 38px; height: 38px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%;
    border: 1px solid rgba(17,19,26,0.12);
    background: #fff;
    font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
    color: #5b4bb0;
  }
  .pp-title { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
</style>
</head>
<body>
  <div class="pp-wrap">
    <header class="pp-head">
      <span class="pp-avatar">PP</span>
      <h1 class="pp-title">Personal Planner</h1>
    </header>
    <!-- shared/calendar.js mounts here when the dashboard isn't present -->
    <div data-calendar-root></div>
  </div>
<script src="../shared/calendar.js?v=14"></script>
<script src="../shared/planner-text.js?v=18"></script>
<script src="../shared/nav.js"></script>
<script src="../shared/announcement.js"></script>
</body>
</html>
