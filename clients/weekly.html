<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clients — Project Clarity</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<!-- Same rich-text toolbar + checkbox/highlight/divider styles the Personal
     Planner uses, so cells behave exactly like the planner's cells. -->
<link rel="stylesheet" href="../shared/planner-text.css?v=11" />
<script src="../shared/clients.js"></script>
<script>
  /* =====================================================================
     Clients — the Personal Planner's section table, copied exactly, but
     as ONE matrix (no dates / weeks / calendar). Both the columns and the
     rows are plain free-text headers the user types and manages; every
     cell is the same free-text rich cell as the planner (toolbar:
     highlight, bold, checkboxes, dividers; smart paste). Syncs under 'weekly'.
     ===================================================================== */
  window.CLIENT_DATA = {
    id:       'weekly',
    name:     'Clients',
    initials: 'CL',
    sub:      'Client operating matrix',
  };
</script>
<script src="../shared/sync.js"></script>
<style>
  :root {
    --bg:        #f6f1e2;
    --surface:   #ffffff;
    --ink:       #2b2f3a;
    --ink-mute:  #6b7080;
    --line:      #e7e1cf;
    --line-soft: #f0ead9;
    --accent:    #2960ff;
    --accent-bg: #eef2ff;
    --label-w:   168px;
    --col-min:   250px;
    --radius:    12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  .cx-wrap { max-width: 100%; margin: 0 auto; padding: 24px 22px 28px; }

  .cx-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 18px; flex-wrap: wrap; margin-bottom: 15px;
  }
  .cx-eyebrow {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--accent); font-weight: 700;
  }
  .cx-title { font-size: 25px; font-weight: 700; margin: 5px 0 0; letter-spacing: -0.01em; }
  .cx-sub { color: var(--ink-mute); font-size: 13px; margin: 4px 0 0; max-width: 680px; line-height: 1.5; }
  .cx-actions { display: flex; gap: 8px; align-items: center; }
  .cx-btn {
    appearance: none; background: var(--surface); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 14px; font: 600 12.5px/1 'Inter', sans-serif;
    color: var(--ink); cursor: pointer; white-space: nowrap;
    transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
  }
  .cx-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  .cx-btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cx-btn-primary:hover { background: #1c4fe0; border-color: #1c4fe0; color: #fff; }

  /* ── Board: one grid, frozen header row + frozen label column ───── */
  .cx-board {
    position: relative;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    overflow: auto;
    display: grid;
  }
  .cx-board.is-empty { display: block; padding: 46px 24px; text-align: center; color: var(--ink-mute); }

  .cx-corner {
    position: sticky; top: 0; left: 0; z-index: 7;
    background: var(--surface);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }

  /* Column header — free-text, user typed */
  .cx-chead {
    position: sticky; top: 0; z-index: 6;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    border-right: 1px solid var(--line-soft);
    padding: 9px 12px;
    display: flex; align-items: center; gap: 6px; min-width: 0;
  }
  .cx-chead:last-child { border-right: 0; }
  .cx-chead-name {
    flex: 1 1 auto; min-width: 0;
    font-size: 13.5px; font-weight: 600; color: var(--ink);
    line-height: 1.3; outline: none; cursor: text; overflow-wrap: anywhere;
  }
  .cx-chead-name:empty::before { content: attr(data-placeholder); color: #b8af96; font-weight: 500; font-style: italic; }
  .cx-chead-name:focus { background: var(--accent-bg); border-radius: 5px; box-shadow: 0 0 0 2px var(--accent-bg); }
  .cx-chead-tools { display: flex; align-items: center; gap: 1px; opacity: 0; transition: opacity 120ms ease; flex: 0 0 auto; }
  .cx-chead:hover .cx-chead-tools { opacity: 1; }
  .cx-chead-tools button {
    width: 19px; height: 20px; border: 0; background: transparent;
    color: var(--ink-mute); cursor: pointer; font-size: 13px; line-height: 1;
    border-radius: 5px; display: inline-flex; align-items: center; justify-content: center;
  }
  .cx-chead-tools button:hover { background: var(--accent-bg); color: var(--accent); }
  .cx-chead-del:hover { background: rgba(192,57,43,0.1) !important; color: #c0392b !important; }

  .cx-label {
    position: sticky; left: 0; z-index: 5;
    background: var(--line-soft);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 9px 11px;
    display: flex; flex-direction: column; gap: 6px; min-width: 0;
  }
  .cx-label-name {
    font-size: 13px; font-weight: 700; color: var(--ink);
    line-height: 1.3; outline: none; cursor: text; overflow-wrap: anywhere;
  }
  .cx-label-name:focus { background: #fff; border-radius: 5px; box-shadow: 0 0 0 2px var(--accent-bg); }
  .cx-label-tools { display: flex; gap: 3px; opacity: 0; transition: opacity 130ms ease; }
  .cx-label:hover .cx-label-tools { opacity: 1; }
  .cx-label-tools button {
    width: 21px; height: 21px; border: 1px solid var(--line);
    background: #fff; color: var(--ink-mute); border-radius: 5px; cursor: pointer;
    font-size: 12px; line-height: 1; display: inline-flex; align-items: center; justify-content: center;
  }
  .cx-label-tools button:hover { color: var(--accent); border-color: var(--accent); }
  .cx-label-del:hover { color: #c0392b; border-color: #c0392b; }

  /* Free-text cell — same editing model as the planner's section cells */
  .cx-cell {
    border-right: 1px solid var(--line-soft);
    border-bottom: 1px solid var(--line);
    padding: 8px 10px;
    min-width: 0;
    outline: none;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--ink);
    overflow-wrap: anywhere;
    cursor: text;
  }
  .cx-cell:last-child { border-right: 0; }
  .cx-cell:focus { background: rgba(41,96,255,0.028); }
  .cx-cell[data-placeholder]:empty::before {
    content: attr(data-placeholder);
    color: #b8af96; font-style: italic;
  }

  .cx-divider {
    grid-column: 1 / -1;
    height: 7px; margin-top: -7px;
    cursor: row-resize; background: transparent; z-index: 3;
    transition: background 120ms ease;
  }
  .cx-divider:hover { background: var(--accent-bg); }

  .cx-addrow {
    grid-column: 1 / -1;
    padding: 8px 12px;
    border-top: 1px solid var(--line-soft);
    background: var(--surface);
    position: sticky; left: 0;
  }
  .cx-addrow button {
    border: 1px dashed #cfc6ab; background: #fff; color: var(--ink-mute);
    border-radius: 8px; padding: 6px 12px; font: 500 12px/1 'Inter', sans-serif; cursor: pointer;
  }
  .cx-addrow button:hover { border-color: var(--accent); color: var(--accent); }

  .cx-empty-hint { font-size: 14px; }

  /* Right-click colour menu (cell background + section label colour) */
  .cx-colormenu {
    position: absolute; z-index: 9999; display: none;
    background: #fff; border: 1px solid var(--line);
    border-radius: 10px; padding: 8px; box-shadow: 0 12px 34px rgba(17,19,26,0.18);
  }
  .cx-colormenu.is-open { display: block; }
  .cx-colormenu-sw { display: grid; grid-template-columns: repeat(4, 22px); gap: 6px; }
  .cx-colormenu-sw button {
    width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.08); cursor: pointer; padding: 0;
  }
  .cx-colormenu-clear {
    margin-top: 8px; width: 100%; border: 1px solid var(--line); background: #fff;
    border-radius: 7px; padding: 5px; font: 500 11.5px/1 'Inter', sans-serif; color: var(--ink-mute); cursor: pointer;
  }
  .cx-colormenu-clear:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<div class="cx-wrap">
  <header class="cx-head">
    <div>
      <div class="cx-eyebrow">Board</div>
      <h1 class="cx-title">Clients</h1>
    </div>
    <div class="cx-actions">
      <button type="button" class="cx-btn" id="cx-add-client">+ Add column</button>
      <button type="button" class="cx-btn cx-btn-primary" id="cx-add-section">+ Add row</button>
    </div>
  </header>

  <div class="cx-board" id="cx-board"></div>
</div>

<script src="../shared/planner-text.js?v=18"></script>
<script src="../shared/nav.js?v=1"></script>
<script>
(function bootClientsBoard() {
  const COLUMNS_KEY  = 'pc-ops::weekly::matrix::columns::v1';
  const SECTIONS_KEY = 'pc-ops::weekly::matrix::sections::v1';
  const CELLS_KEY    = 'pc-ops::weekly::matrix::cells::v1';
  const CELLCLR_KEY  = 'pc-ops::weekly::matrix::cellcolor::v1';

  const CELL_COLORS = ['#dbeafe', '#dcfce7', '#fef9c3', '#ffedd5', '#ede9fe', '#fce7f3', '#fee2e2', '#e2e8f0'];

  const board = document.getElementById('cx-board');

  /* ── Helpers ──────────────────────────────────────────────────── */
  let __seq = 0;
  function genId(p) {
    return (p || 'x') + Date.now().toString(36) + (__seq++).toString(36) + Math.floor(Math.random() * 1e4).toString(36);
  }
  function canWrite() {
    const P = window.__planner;
    return !(P && typeof P.canPersist === 'function') || P.canPersist();
  }
  function readJSON(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return v == null ? fallback : v; }
    catch (_) { return fallback; }
  }
  function writeJSON(key, val) { if (!canWrite()) return; try { localStorage.setItem(key, JSON.stringify(val)); } catch (_) {} }

  /* ── Columns (free-text headers) ──────────────────────────────── */
  function mkColumn(name) { return { id: genId('c'), name: name || '' }; }
  function loadColumns() { const a = readJSON(COLUMNS_KEY, []); return Array.isArray(a) ? a : []; }
  function saveColumns(a) { writeJSON(COLUMNS_KEY, a); }
  // First run: a few blank columns for the user to name themselves.
  function seedColumnNames() { return ['', '', '']; }
  function getColumns() {
    const arr = loadColumns();
    if (arr.length) return arr;
    // Reuse the transient seed already in memory so ids stay stable across
    // renders that happen before sync has seeded (new ids would orphan cells).
    if (currentColumns.length) return currentColumns;
    const def = seedColumnNames().map(mkColumn);
    if (canWrite()) { saveColumns(def); return loadColumns(); }
    return def;
  }
  function addColumn() {
    const a = getColumns().slice();
    const col = mkColumn('');
    a.push(col);
    saveColumns(a);
    currentColumns = getColumns();
    renderBoard();
    const el = board.querySelector('.cx-chead[data-col="' + col.id + '"] .cx-chead-name');
    if (el) el.focus();
  }
  function renameColumn(id, name) { const a = loadColumns(); const c = a.find((x) => x.id === id); if (c) { c.name = name; saveColumns(a); } }
  function deleteColumn(id) {
    const a = loadColumns();
    const c = a.find((x) => x.id === id);
    const name = (c && c.name && c.name.trim()) || 'this column';
    const cells = loadCells();
    const hasContent = getSections().some((s) => (cells[cellKey(id, s.id)] || '').trim());
    const msg = 'Delete the "' + name + '" column?' +
      (hasContent ? '\n\nEverything in this column, for every row, will be removed too. This can’t be undone.'
                  : '\n\nThis can’t be undone.');
    if (!window.confirm(msg)) return;
    saveColumns(a.filter((x) => x.id !== id));
    const nc = loadCells(); getSections().forEach((s) => delete nc[cellKey(id, s.id)]); saveCells(nc);
    const cc = loadCellColors(); getSections().forEach((s) => delete cc[cellKey(id, s.id)]); saveCellColors(cc);
    currentColumns = getColumns();
    renderBoard();
  }
  function moveColumn(id, dir) {
    const a = loadColumns();
    const i = a.findIndex((x) => x.id === id), j = i + dir;
    if (i < 0 || j < 0 || j >= a.length) return;
    const t = a[i]; a[i] = a[j]; a[j] = t; saveColumns(a);
    currentColumns = getColumns(); renderBoard();
  }

  /* ── Sections (free-text rows) ────────────────────────────────── */
  function mkSection(name) { return { id: genId('s'), name: name, height: 120 }; }
  function loadSections() { const a = readJSON(SECTIONS_KEY, []); return Array.isArray(a) ? a : []; }
  function saveSections(a) { writeJSON(SECTIONS_KEY, a); }
  function getSections() {
    const arr = loadSections();
    if (arr.length) return arr;
    if (currentSections.length) return currentSections;   // stable transient seed
    const def = [mkSection('Row 1'), mkSection('Row 2'), mkSection('Row 3')];
    if (canWrite()) { saveSections(def); return loadSections(); }
    return def;
  }
  function addSection() { const a = getSections().slice(); a.push(mkSection('New row')); saveSections(a); renderBoard(); }
  function renameSection(id, name) { const a = loadSections(); const s = a.find((x) => x.id === id); if (s) { s.name = name; saveSections(a); } }
  function deleteSection(id) {
    const a = loadSections();
    if (a.length <= 1) return;
    const s = a.find((x) => x.id === id);
    const name = (s && s.name && s.name.trim()) || 'this row';
    const cells = loadCells();
    const hasContent = currentColumns.some((c) => (cells[cellKey(c.id, id)] || '').trim());
    const msg = 'Delete the "' + name + '" row?' +
      (hasContent ? '\n\nEverything in this row, for every column, will be removed too. This can’t be undone.'
                  : '\n\nThis can’t be undone.');
    if (!window.confirm(msg)) return;
    saveSections(a.filter((x) => x.id !== id));
    const nc = loadCells();  currentColumns.forEach((c) => delete nc[cellKey(c.id, id)]);  saveCells(nc);
    const cc = loadCellColors(); currentColumns.forEach((c) => delete cc[cellKey(c.id, id)]); saveCellColors(cc);
    renderBoard();
  }
  function moveSection(id, dir) {
    const a = loadSections();
    const i = a.findIndex((x) => x.id === id), j = i + dir;
    if (i < 0 || j < 0 || j >= a.length) return;
    const t = a[i]; a[i] = a[j]; a[j] = t; saveSections(a); renderBoard();
  }
  function startResize(e, id, labelEl) {
    e.preventDefault(); e.stopPropagation();
    const py = (ev) => (ev.touches && ev.touches[0]) ? ev.touches[0].clientY
                     : (ev.changedTouches && ev.changedTouches[0]) ? ev.changedTouches[0].clientY : ev.clientY;
    const startY = py(e), startH = labelEl.getBoundingClientRect().height;
    const onMove = (ev) => { if (ev.cancelable) ev.preventDefault(); labelEl.style.minHeight = Math.max(56, startH + (py(ev) - startY)) + 'px'; };
    const onUp = (ev) => {
      document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onUp);
      const h = Math.round(Math.max(56, startH + (py(ev) - startY)));
      const a = loadSections(); const s = a.find((x) => x.id === id); if (s) { s.height = h; saveSections(a); }
    };
    document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, { passive: false }); document.addEventListener('touchend', onUp);
  }
  function sectionColor(id, color) {
    const a = loadSections(); const s = a.find((x) => x.id === id); if (!s) return;
    if (color) s.color = color; else delete s.color; saveSections(a);
    document.querySelectorAll('.cx-label[data-section="' + id + '"]').forEach((l) => { l.style.backgroundColor = color || ''; });
  }

  /* ── Cells (free-text HTML) + cell colours ────────────────────── */
  function cellKey(colId, sid) { return colId + '::' + sid; }
  function loadCells() { return readJSON(CELLS_KEY, {}) || {}; }
  function saveCells(o) { writeJSON(CELLS_KEY, o); }
  function loadCellColors() { return readJSON(CELLCLR_KEY, {}) || {}; }
  function saveCellColors(o) { writeJSON(CELLCLR_KEY, o); }
  function setCellColor(ck, color) {
    const all = loadCellColors(); if (color) all[ck] = color; else delete all[ck]; saveCellColors(all);
    document.querySelectorAll('.cx-cell[data-cell="' + ck + '"]').forEach((c) => { c.style.backgroundColor = color || ''; });
  }

  /* ── Right-click colour menu ──────────────────────────────────── */
  let colorMenu = null;
  function buildColorMenu() {
    colorMenu = document.createElement('div');
    colorMenu.className = 'cx-colormenu';
    colorMenu.innerHTML =
      '<div class="cx-colormenu-sw">' +
        CELL_COLORS.map((c) => '<button type="button" data-color="' + c + '" style="background:' + c + '"></button>').join('') +
      '</div>' +
      '<button type="button" class="cx-colormenu-clear" data-color="">No colour</button>';
    document.body.appendChild(colorMenu);
    colorMenu.addEventListener('mousedown', (e) => e.preventDefault());
    colorMenu.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-color]'); if (!btn) return;
      if (colorMenu.__apply) colorMenu.__apply(btn.getAttribute('data-color'));
      closeColorMenu();
    });
  }
  function openColorMenu(e, applyFn) {
    if (!colorMenu) buildColorMenu();
    colorMenu.__apply = applyFn;
    colorMenu.classList.add('is-open');
    colorMenu.style.left = (e.pageX) + 'px';
    colorMenu.style.top = (e.pageY) + 'px';
    const r = colorMenu.getBoundingClientRect();
    if (r.right > window.innerWidth) colorMenu.style.left = Math.max(6, e.pageX - r.width) + 'px';
    if (r.bottom > window.innerHeight) colorMenu.style.top = Math.max(6, e.pageY - r.height) + 'px';
    const outside = (ev) => { if (!colorMenu.contains(ev.target)) closeColorMenu(); };
    setTimeout(() => document.addEventListener('mousedown', outside, true), 0);
    colorMenu.__outside = outside;
  }
  function closeColorMenu() {
    if (!colorMenu) return;
    colorMenu.classList.remove('is-open');
    if (colorMenu.__outside) { document.removeEventListener('mousedown', colorMenu.__outside, true); colorMenu.__outside = null; }
  }

  /* ── Rendering ────────────────────────────────────────────────── */
  let currentColumns = [];
  let currentSections = [];

  // The seed (columns + default sections) is rendered transiently before sync
  // finishes seeding. Once canPersist() flips true, persist it — but only if
  // storage is still empty, so we never clobber real data that arrived from the
  // server. Reuses the in-memory ids, so cells stay attached to the right cell.
  function persistSeedWhenReady() {
    if (canWrite()) {
      if (!loadColumns().length && currentColumns.length) saveColumns(currentColumns);
      if (!loadSections().length && currentSections.length) saveSections(currentSections);
      return;
    }
    setTimeout(persistSeedWhenReady, 400);
  }

  function columnHeadEl(col, idx, total) {
    const head = document.createElement('div');
    head.className = 'cx-chead';
    head.dataset.col = col.id;

    const name = document.createElement('div');
    name.className = 'cx-chead-name';
    name.setAttribute('contenteditable', 'plaintext-only');
    name.setAttribute('spellcheck', 'false');
    name.dataset.placeholder = 'Column name…';
    name.textContent = col.name || '';
    name.addEventListener('input', () => renameColumn(col.id, name.textContent));

    const tools = document.createElement('div');
    tools.className = 'cx-chead-tools';
    const left = document.createElement('button');  left.type = 'button'; left.textContent = '‹'; left.title = 'Move left';
    const right = document.createElement('button'); right.type = 'button'; right.textContent = '›'; right.title = 'Move right';
    const del = document.createElement('button');   del.type = 'button';  del.textContent = '×'; del.title = 'Delete column'; del.className = 'cx-chead-del';
    left.style.visibility = idx === 0 ? 'hidden' : '';
    right.style.visibility = idx === total - 1 ? 'hidden' : '';
    left.addEventListener('click', (e) => { e.stopPropagation(); moveColumn(col.id, -1); });
    right.addEventListener('click', (e) => { e.stopPropagation(); moveColumn(col.id, 1); });
    del.addEventListener('click', (e) => { e.stopPropagation(); deleteColumn(col.id); });
    tools.appendChild(left); tools.appendChild(right); tools.appendChild(del);

    head.appendChild(name); head.appendChild(tools);
    return head;
  }

  function labelEl(sec) {
    const label = document.createElement('div');
    label.className = 'cx-label';
    label.dataset.section = sec.id;
    label.style.minHeight = (sec.height || 120) + 'px';
    if (sec.color) label.style.backgroundColor = sec.color;

    const name = document.createElement('div');
    name.className = 'cx-label-name';
    name.setAttribute('contenteditable', 'plaintext-only');
    name.setAttribute('spellcheck', 'false');
    name.textContent = sec.name;
    name.addEventListener('input', () => renameSection(sec.id, name.textContent));

    const tools = document.createElement('div');
    tools.className = 'cx-label-tools';
    tools.innerHTML =
      '<button type="button" class="cx-label-up" title="Move up">↑</button>' +
      '<button type="button" class="cx-label-down" title="Move down">↓</button>' +
      '<button type="button" class="cx-label-del" title="Delete row">×</button>';
    tools.querySelector('.cx-label-up').addEventListener('click', (e) => { e.stopPropagation(); moveSection(sec.id, -1); });
    tools.querySelector('.cx-label-down').addEventListener('click', (e) => { e.stopPropagation(); moveSection(sec.id, 1); });
    tools.querySelector('.cx-label-del').addEventListener('click', (e) => { e.stopPropagation(); deleteSection(sec.id); });
    label.addEventListener('contextmenu', (e) => {
      e.preventDefault(); e.stopPropagation();
      openColorMenu(e, (color) => sectionColor(sec.id, color));
    });

    label.appendChild(name); label.appendChild(tools);
    return label;
  }

  function cellEl(colId, sec) {
    const ck = cellKey(colId, sec.id);
    const cell = document.createElement('div');
    // cwg-col-free hooks the shared planner toolbar + smart paste onto this cell.
    cell.className = 'cx-cell cwg-col-free';
    cell.setAttribute('contenteditable', 'true');
    cell.dataset.cell = ck;
    cell.dataset.placeholder = '';
    cell.innerHTML = loadCells()[ck] || '';
    const clr = loadCellColors()[ck];
    if (clr) cell.style.backgroundColor = clr;

    cell.addEventListener('input', () => {
      if (!canWrite()) return;
      const html = cell.innerHTML;
      const cur = loadCells();
      const stripped = html.replace(/<br\s*\/?>(\s|&nbsp;|​)*/gi, '').trim();
      if (!stripped) delete cur[ck]; else cur[ck] = html;
      saveCells(cur);
    });
    cell.addEventListener('contextmenu', (e) => {
      e.preventDefault(); e.stopPropagation();
      openColorMenu(e, (color) => setCellColor(ck, color));
    });
    return cell;
  }

  function renderBoard() {
    currentColumns = getColumns();
    currentSections = getSections();
    board.innerHTML = '';
    board.classList.remove('is-empty');

    const cols = currentColumns;
    if (!cols.length) {
      board.classList.add('is-empty');
      board.innerHTML = '<div class="cx-empty-hint">No columns yet — click <strong>+ Add column</strong> to start.</div>';
      return;
    }

    board.style.gridTemplateColumns = 'var(--label-w) repeat(' + cols.length + ', minmax(var(--col-min), 1fr))';

    const corner = document.createElement('div'); corner.className = 'cx-corner'; board.appendChild(corner);
    cols.forEach((c, i) => board.appendChild(columnHeadEl(c, i, cols.length)));

    currentSections.forEach((sec) => {
      board.appendChild(labelEl(sec));
      cols.forEach((c) => board.appendChild(cellEl(c.id, sec)));
      const divider = document.createElement('div');
      divider.className = 'cx-divider'; divider.title = 'Drag to resize this row';
      const lbl = board.querySelector('.cx-label[data-section="' + sec.id + '"]');
      divider.addEventListener('mousedown', (e) => startResize(e, sec.id, lbl));
      divider.addEventListener('touchstart', (e) => startResize(e, sec.id, lbl), { passive: false });
      board.appendChild(divider);
    });

    const addrow = document.createElement('div'); addrow.className = 'cx-addrow';
    const addBtn = document.createElement('button'); addBtn.type = 'button'; addBtn.textContent = '+ Add row';
    addBtn.addEventListener('click', addSection); addrow.appendChild(addBtn); board.appendChild(addrow);

    sizeBoard();
  }

  function sizeBoard() {
    const top = board.getBoundingClientRect().top + window.scrollY;
    board.style.maxHeight = Math.max(320, window.innerHeight - top + window.scrollY - 22) + 'px';
  }

  /* ── Boot ─────────────────────────────────────────────────────── */
  document.getElementById('cx-add-section').addEventListener('click', addSection);
  document.getElementById('cx-add-client').addEventListener('click', addColumn);
  window.addEventListener('resize', sizeBoard);
  window.addEventListener('load', sizeBoard);

  renderBoard();
  persistSeedWhenReady();
})();
</script>

<script src="../shared/announcement.js"></script>
</body>
</html>
